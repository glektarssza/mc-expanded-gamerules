plugins {
    id('java-library')
    id('maven-publish')
    id('com.diffplug.spotless')
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter {
            includeGroup('org.parchmentmc.data')
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

spotless {
    format 'misc', {
        target '*.gradle', '.gitattributes', '.gitignore'

        // -- Generic formatting options
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    format 'styling', {
        target '**/*.json,**/*.yaml'

        prettier('3.8.2')
            .configFile("${rootProject.rootDir}/.prettierrc.mjs")
    }
    java {
        // -- Generic formatting options
        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()

        // -- Java-specific formatting options
        removeUnusedImports()
        forbidWildcardImports()
        forbidModuleImports()
        formatAnnotations()
        eclipse('4.26')
            .configFile("${rootProject.rootDir}/formatting_rules.xml")
            .sortMembersEnabled(true)
            .sortMembersOrder("T,SF,SI,SM,F,I,C,M")
            .sortMembersVisibilityOrderEnabled(true)
            .sortMembersVisibilityOrder("V,D,R,B")
    }
}

['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each {variant ->
    configurations."${variant}".outgoing {
        capability("${mod_group}:${project.name}:${mod_version}")
        capability("${mod_group}:${base.archivesName.get()}:${mod_version}")
        capability("${mod_group}:${mod_id}-${project.name}-${minecraft_version}:${mod_version}")
        capability("${mod_group}:${mod_id}:${mod_version}")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE.md'))
}

jar {
    from(rootProject.file('LICENSE.md'))

    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.jar.archiveVersion,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
        'mod_name'                  : mod_name,
        'mod_id'                    : mod_id,
        'mod_group'                 : mod_group,
        'mod_version'               : mod_version,
        'mod_author'                : mod_author,
        'mod_description'           : mod_description,
        'mod_license'               : mod_license,
        'mod_credits'               : mod_credits,
        'mixins_package'            : mixins_package,
        'minecraft_version'         : minecraft_version,
        'minecraft_version_range'   : minecraft_version_range,
        'java_version'              : java_version,
        'forge_version'             : forge_version,
        'forge_version_range'       : forge_version_range,
        'forge_loader_version_range': forge_loader_version_range,
        'neoforge_version'          : neoforge_version,
        'neoforge_version_range'    : neoforge_version_range,
        'fabric_version'            : fabric_version,
        'fabric_loader_version'     : fabric_loader_version
    ]

    var jsonExpandProps = expandProps.collectEntries {key, value ->
        def result = value
        if (!(result instanceof String)) {
            return result
        }
        result = result.replace("\n", "\\\\n")
        if (result.startsWith('"') && result.endsWith('"')) {
            result = result.substring(1, result.length() - 1)
        }
        return [(key): result]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
